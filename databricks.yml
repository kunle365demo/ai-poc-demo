# Databricks Asset Bundle: onboard -> bronze -> silver as one job on serverless compute.
bundle:
  name: sdp_meta_cobol

variables:
  env:
    description: Suffix used to pick environment-specific keys in the onboarding file
    default: dev
  dataflowspec_table:
    description: Table that stores the dataflow specs
    default: fip_poc.fip_poc_sc.dataflowspec
  data_flow_group:
    default: A1

artifacts:
  sdp_meta_cobol:
    type: whl
    path: .
    build: pip wheel . --no-deps -w dist

targets:
  dev:
    default: true
    mode: development

resources:
  jobs:
    cobol_ingestion:
      name: sdp-meta COBOL ingestion
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ./dist/*.whl
      tasks:
        - task_key: onboard
          environment_key: default
          python_wheel_task:
            package_name: sdp_meta_cobol
            entry_point: sdp_meta
            parameters:
              - onboard
              - --onboarding_file_path=${workspace.file_path}/examples/conf/onboarding.json
              - --env=${var.env}
              - --dataflowspec_table=${var.dataflowspec_table}
        - task_key: bronze
          depends_on:
            - task_key: onboard
          environment_key: default
          python_wheel_task:
            package_name: sdp_meta_cobol
            entry_point: sdp_meta
            parameters:
              - run
              - --layer=bronze
              - --dataflowspec_table=${var.dataflowspec_table}
              - --group=${var.data_flow_group}
        - task_key: silver
          depends_on:
            - task_key: bronze
          environment_key: default
          python_wheel_task:
            package_name: sdp_meta_cobol
            entry_point: sdp_meta
            parameters:
              - run
              - --layer=silver
              - --dataflowspec_table=${var.dataflowspec_table}
              - --group=${var.data_flow_group}
